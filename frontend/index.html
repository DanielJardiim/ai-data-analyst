<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Data Analyst</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1117;
        color: #e8e8e8;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 16px 24px;
        border-bottom: 1px solid #2a2a3a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #16181f;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }

      .db-badge {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        background: #1e2030;
        border: 1px solid #2a2a3a;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .welcome {
        text-align: center;
        margin: auto;
        max-width: 480px;
      }

      .welcome h2 {
        font-size: 22px;
        font-weight: 600;
        color: #fff;
        margin-bottom: 8px;
      }

      .welcome p {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .suggestions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .suggestion {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #2a2a3a;
        background: #16181f;
        color: #aaa;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
      }

      .suggestion:hover {
        border-color: #6366f1;
        color: #fff;
        background: #1e2030;
      }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 780px;
        width: 100%;
      }

      .msg.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .msg.bot {
        align-self: flex-start;
        align-items: flex-start;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
        max-width: 100%;
      }

      .msg.user .bubble {
        background: #6366f1;
        color: #fff;
        border-bottom-right-radius: 3px;
      }

      .msg.bot .bubble {
        background: #16181f;
        border: 1px solid #2a2a3a;
        color: #e8e8e8;
        border-bottom-left-radius: 3px;
        width: 100%;
      }

      .explanation {
        font-size: 14px;
        line-height: 1.7;
        color: #e8e8e8;
        margin-bottom: 14px;
      }

      .sql-section {
        margin-top: 10px;
      }

      .sql-toggle {
        font-size: 11px;
        color: #555;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: color 0.15s;
      }

      .sql-toggle:hover {
        color: #888;
      }

      .sql-block {
        margin-top: 8px;
        background: #0f1117;
        border: 1px solid #2a2a3a;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Cascadia Code', 'Fira Code', monospace;
        font-size: 12px;
        color: #a78bfa;
        white-space: pre-wrap;
        word-break: break-all;
        display: none;
      }

      .results-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 12px;
        border-radius: 8px;
        overflow: hidden;
      }

      .results-table th {
        text-align: left;
        padding: 8px 12px;
        background: #1e2030;
        color: #888;
        font-weight: 500;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .results-table td {
        padding: 8px 12px;
        border-top: 1px solid #2a2a3a;
        color: #ccc;
      }

      .results-table tr:hover td {
        background: #1a1c27;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #555;
        font-size: 13px;
        padding: 12px 16px;
        background: #16181f;
        border: 1px solid #2a2a3a;
        border-radius: 12px;
        border-bottom-left-radius: 3px;
      }

      .dots span {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #6366f1;
        margin: 0 2px;
        animation: bounce 1.2s infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .error-bubble {
        background: #1f1215;
        border: 1px solid #3f2030;
        color: #f87171;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13px;
      }

      .input-area {
        padding: 16px 24px;
        border-top: 1px solid #2a2a3a;
        background: #16181f;
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      textarea {
        flex: 1;
        background: #0f1117;
        border: 1px solid #2a2a3a;
        border-radius: 10px;
        padding: 12px 16px;
        color: #e8e8e8;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        outline: none;
        min-height: 46px;
        max-height: 140px;
        line-height: 1.5;
        transition: border-color 0.15s;
      }

      textarea:focus {
        border-color: #6366f1;
      }
      textarea::placeholder {
        color: #444;
      }

      button#send {
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
        white-space: nowrap;
        height: 46px;
      }

      button#send:hover {
        background: #5254cc;
      }
      button#send:disabled {
        background: #2a2a3a;
        color: #555;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="logo">◈</div>
        <h1>AI Data Analyst</h1>
      </div>
      <div class="db-badge">
        <div class="dot"></div>
        analyst_db · PostgreSQL
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2>Olá! Como posso ajudar?</h2>
        <p>
          Faça uma pergunta sobre os dados em linguagem natural.<br />
          Vou converter em SQL, consultar o banco e explicar o resultado.
        </p>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion(this)">
            Quais são todos os produtos disponíveis?
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            Qual foi o faturamento total dos pedidos concluídos?
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            Qual produto gerou mais receita?
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            Quais clientes fizeram pedidos nos últimos 30 dias?
          </button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="input"
        placeholder="Faça uma pergunta sobre seus dados..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send" onclick="sendMessage()">Enviar</button>
    </div>

    <script>
      const API = 'http://localhost:8000';

      function useSuggestion(btn) {
        document.getElementById('input').value = btn.textContent.trim();
        sendMessage();
      }

      function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      }

      function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function appendUserMessage(text) {
        document.getElementById('welcome')?.remove();
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        document.getElementById('messages').appendChild(div);
        scrollBottom();
        return div;
      }

      function appendLoading() {
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.id = 'loading';
        div.innerHTML = `
      <div class="loading">
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
        Consultando o banco de dados...
      </div>`;
        document.getElementById('messages').appendChild(div);
        scrollBottom();
      }

      function removeLoading() {
        document.getElementById('loading')?.remove();
      }

      function appendBotMessage(data) {
        const div = document.createElement('div');
        div.className = 'msg bot';

        const tableHtml = buildTable(data.results);
        const msgId = Date.now();

        div.innerHTML = `
      <div class="bubble">
        <div class="explanation">${escapeHtml(data.explanation)}</div>
        ${tableHtml}
        <div class="sql-section">
          <button class="sql-toggle" onclick="toggleSql(${msgId})">
            ▶ ver SQL gerado
          </button>
          <pre class="sql-block" id="sql-${msgId}">${escapeHtml(data.sql)}</pre>
        </div>
      </div>`;

        document.getElementById('messages').appendChild(div);
        scrollBottom();
      }

      function appendError(msg) {
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = `<div class="error-bubble">Erro: ${escapeHtml(msg)}</div>`;
        document.getElementById('messages').appendChild(div);
        scrollBottom();
      }

      function buildTable(results) {
        if (!results || results.length === 0) return '';
        const headers = Object.keys(results[0]);
        const ths = headers.map((h) => `<th>${escapeHtml(h)}</th>`).join('');
        const trs = results
          .map((row) => {
            const tds = headers.map((h) => `<td>${escapeHtml(String(row[h] ?? ''))}</td>`).join('');
            return `<tr>${tds}</tr>`;
          })
          .join('');
        return `<table class="results-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
      }

      function toggleSql(id) {
        const block = document.getElementById(`sql-${id}`);
        const btn = block.previousElementSibling;
        const visible = block.style.display === 'block';
        block.style.display = visible ? 'none' : 'block';
        btn.textContent = (visible ? '▶' : '▼') + ' ver SQL gerado';
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function scrollBottom() {
        const el = document.getElementById('messages');
        el.scrollTop = el.scrollHeight;
      }

      async function sendMessage() {
        const input = document.getElementById('input');
        const question = input.value.trim();
        if (!question) return;

        const btn = document.getElementById('send');
        input.value = '';
        input.style.height = 'auto';
        btn.disabled = true;

        appendUserMessage(question);
        appendLoading();

        try {
          const response = await fetch(`${API}/query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question }),
          });

          removeLoading();

          if (!response.ok) {
            const err = await response.json();
            appendError(err.detail || 'Erro desconhecido');
            return;
          }

          const data = await response.json();
          appendBotMessage(data);
        } catch (err) {
          removeLoading();
          appendError('Não foi possível conectar à API. Verifique se o servidor está rodando.');
        } finally {
          btn.disabled = false;
          input.focus();
        }
      }
    </script>
  </body>
</html>
